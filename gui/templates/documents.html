{% extends "base.html" %}
{% block title %}Documentos{% endblock %}
{% block content %}
<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="margin:0;">Documentos</h2>
        <div style="display:flex;gap:8px;">
            <select id="filterEstado" onchange="loadDocs()" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
                <option value="">Todos los estados</option>
                <option value="PENDIENTE" {{ 'selected' if estado == 'PENDIENTE' }}>Pendiente</option>
                <option value="PROCESADO" {{ 'selected' if estado == 'PROCESADO' }}>Procesado</option>
                <option value="ERROR" {{ 'selected' if estado == 'ERROR' }}>Error</option>
                <option value="ANULADO" {{ 'selected' if estado == 'ANULADO' }}>Anulado</option>
                <option value="NO DECLARAR" {{ 'selected' if estado == 'NO DECLARAR' }}>No Declarar</option>
            </select>
            <input type="text" id="filterSerie" placeholder="Serie..." onkeyup="loadDocs()"
                   value="{{ serie or '' }}" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:80px;">
            <input type="date" id="filterFecha" onchange="loadDocs()"
                   value="{{ fecha or '' }}" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
        </div>
    </div>

    <div style="display:flex;gap:0;border-bottom:2px solid #eee;margin-bottom:0;">
        <button class="tab-btn {{ 'active' if tab == 'ventas' }}" onclick="switchTab('ventas')">Facturas/Boletas</button>
        <button class="tab-btn {{ 'active' if tab == 'notas_credito' }}" onclick="switchTab('notas_credito')">Notas Crédito</button>
        <button class="tab-btn {{ 'active' if tab == 'guias' }}" onclick="switchTab('guias')">Guías</button>
        <button class="tab-btn {{ 'active' if tab == 'anulados' }}" onclick="switchTab('anulados')">Anulados</button>
    </div>

    <div style="overflow-x:auto;">
        <table class="doc-table" id="docTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody">
                <tr><td colspan="10" style="text-align:center;padding:20px;color:#888;">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <div id="docCount" style="padding:8px 12px;font-size:12px;color:#888;border-top:1px solid #eee;"></div>
</div>

<div id="previewModal" class="modal-overlay" style="display:none;" onclick="closePreview(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 id="previewTitle" style="margin:0;font-size:15px;">Preview</h3>
            <button onclick="document.getElementById('previewModal').style.display='none'" style="background:none;border:none;font-size:18px;cursor:pointer;">&times;</button>
        </div>
        <div style="display:flex;gap:0;border-bottom:2px solid #eee;margin-bottom:12px;">
            <button class="tab-btn active" onclick="switchPreviewTab('payload', this)">Payload a enviar</button>
            <button class="tab-btn" onclick="switchPreviewTab('response', this)">Respuesta recibida</button>
        </div>
        <pre id="previewPayload" class="json-preview" style="display:block;"></pre>
        <pre id="previewResponse" class="json-preview" style="display:none;"></pre>
    </div>
</div>

<style>
    .tab-btn { padding:8px 16px; border:none; background:none; cursor:pointer; font-size:13px; color:#888; border-bottom:2px solid transparent; margin-bottom:-2px; }
    .tab-btn:hover { color:#333; }
    .tab-btn.active { color:#1a1a2e; border-bottom-color:#1a1a2e; font-weight:600; }
    .doc-table { width:100%; border-collapse:collapse; font-size:13px; }
    .doc-table th { text-align:left; padding:8px 10px; background:#f8f9fa; color:#555; font-weight:600; border-bottom:1px solid #eee; white-space:nowrap; }
    .doc-table td { padding:7px 10px; border-bottom:1px solid #f0f0f0; }
    .doc-table tr:hover { background:#f8f9fa; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
    .badge-pendiente { background:#fef3c7; color:#92400e; }
    .badge-procesado { background:#d1fae5; color:#065f46; }
    .badge-error { background:#fee2e2; color:#991b1b; }
    .badge-anulado { background:#e5e7eb; color:#374151; }
    .badge-nodeclarar { background:#dbeafe; color:#1e40af; }
    .badge-default { background:#f3f4f6; color:#374151; }
    .action-btn { padding:3px 8px; border:1px solid #ddd; border-radius:4px; background:white; cursor:pointer; font-size:11px; color:#555; }
    .action-btn:hover { background:#f3f4f6; border-color:#bbb; }
    .action-btn.primary { background:#1a1a2e; color:white; border-color:#1a1a2e; }
    .action-btn.primary:hover { background:#16213e; }
    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center; }
    .modal-content { background:white; border-radius:8px; padding:20px; width:90%; max-width:700px; max-height:80vh; overflow-y:auto; }
    .json-preview { background:#1a1a2e; color:#e2e8f0; padding:14px; border-radius:6px; font-size:12px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; max-height:50vh; overflow-y:auto; }
</style>

<script>
let currentTab = '{{ tab or "ventas" }}';

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadDocs();
}

function loadDocs() {
    const estado = document.getElementById('filterEstado').value;
    const serie = document.getElementById('filterSerie').value;
    const fecha = document.getElementById('filterFecha').value;
    const params = new URLSearchParams({type: currentTab});
    if (estado) params.set('estado', estado);
    if (serie) params.set('serie', serie);
    if (fecha) params.set('fecha', fecha);

    fetch('/api/documents?' + params.toString())
        .then(r => r.json())
        .then(data => {
            renderTable(data.documents);
            document.getElementById('docCount').textContent = data.count + ' documentos encontrados';
        })
        .catch(() => {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:#ef4444;">Error cargando datos</td></tr>';
        });
}

function renderTable(docs) {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    if (!docs || docs.length === 0) {
        head.innerHTML = '';
        body.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:20px;color:#888;">Sin documentos</td></tr>';
        return;
    }

    let headers = '';
    let rows = '';

    if (currentTab === 'ventas') {
        headers = '<tr><th>ID</th><th>Serie</th><th>Número</th><th>RUC</th><th>Cliente</th><th>Monto</th><th>Estado</th><th>Acciones</th></tr>';
        docs.forEach(d => {
            rows += `<tr>
                <td>${d.id_venta || ''}</td>
                <td>${d.num_serie || ''}</td>
                <td>${d.num_documento || ''}</td>
                <td>${d.ruc || ''}</td>
                <td>${d.nombres_cliente || ''}</td>
                <td>S/. ${parseFloat(d.monto_venta || 0).toFixed(2)}</td>
                <td>${badgeEstado(d.estado_declaracion)}</td>
                <td>
                    <button class="action-btn" onclick='showPreview(${JSON.stringify(d)})'>Preview</button>
                </td>
            </tr>`;
        });
    } else if (currentTab === 'notas_credito') {
        headers = '<tr><th>ID</th><th>Serie</th><th>Número</th><th>Persona</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr>';
        docs.forEach(d => {
            rows += `<tr>
                <td>${d.id_notas_credito_debito || ''}</td>
                <td>${d.serie || ''}</td>
                <td>${d.numero || ''}</td>
                <td>${d.persona || ''}</td>
                <td>${(d.motivo || '').substring(0, 40)}</td>
                <td>${badgeEstado(d.estado_declaracion)}</td>
                <td><button class="action-btn" onclick='showPreview(${JSON.stringify(d)})'>Preview</button></td>
            </tr>`;
        });
    } else if (currentTab === 'guias') {
        headers = '<tr><th>ID</th><th>Serie</th><th>Número</th><th>Destinatario</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr>';
        docs.forEach(d => {
            rows += `<tr>
                <td>${d.id_guia || ''}</td>
                <td>${d.serie || ''}</td>
                <td>${d.numero || ''}</td>
                <td>${d.destinatario || ''}</td>
                <td>${(d.motivo_anulado || '').substring(0, 40)}</td>
                <td>${badgeEstado(d.estado_declaracion)}</td>
                <td><button class="action-btn" onclick='showPreview(${JSON.stringify(d)})'>Preview</button></td>
            </tr>`;
        });
    } else if (currentTab === 'anulados') {
        headers = '<tr><th>ID</th><th>Serie</th><th>Número</th><th>RUC</th><th>Cliente</th><th>Monto</th><th>Estado</th><th>Estado Anul.</th><th>Acciones</th></tr>';
        docs.forEach(d => {
            rows += `<tr>
                <td>${d.id_venta || ''}</td>
                <td>${d.num_serie || ''}</td>
                <td>${d.num_documento || ''}</td>
                <td>${d.ruc || ''}</td>
                <td>${d.nombres_cliente || ''}</td>
                <td>S/. ${parseFloat(d.monto_venta || 0).toFixed(2)}</td>
                <td>${badgeEstado(d.estado_declaracion)}</td>
                <td>${badgeEstado(d.estado_declaracion_anulado)}</td>
                <td><button class="action-btn" onclick='showPreview(${JSON.stringify(d)})'>Preview</button></td>
            </tr>`;
        });
    }

    head.innerHTML = headers;
    body.innerHTML = rows;
}

function badgeEstado(estado) {
    if (!estado) return '<span class="badge badge-default">N/A</span>';
    const map = {
        'PENDIENTE': 'badge-pendiente',
        'PROCESADO': 'badge-procesado',
        'ERROR': 'badge-error',
        'ANULADO': 'badge-anulado',
        'NO DECLARAR': 'badge-nodeclarar',
    };
    const cls = map[estado] || 'badge-default';
    return `<span class="badge ${cls}">${estado}</span>`;
}

function showPreview(doc) {
    document.getElementById('previewTitle').textContent = `Preview: ${doc.num_serie || doc.serie || ''}-${doc.num_documento || doc.numero || ''}`;

    const payload = {};
    const response = {};

    if (doc.observaciones_declaracion) {
        try {
            const parsed = JSON.parse(doc.observaciones_declaracion);
            Object.assign(response, parsed);
        } catch(e) {
            response.raw = doc.observaciones_declaracion;
        }
    }

    if (doc.estado_declaracion === 'PENDIENTE' || doc.estado_declaracion === 'NO DECLARAR') {
        payload.info = 'Documento pendiente de envio. Payload se construira al enviar.';
        payload.estado = doc.estado_declaracion;
        payload.serie = doc.num_serie || doc.serie;
        payload.numero = doc.num_documento || doc.numero;
    } else {
        payload.info = 'Documento ya procesado. Ver respuesta recibida.';
        payload.estado = doc.estado_declaracion;
    }

    document.getElementById('previewPayload').textContent = JSON.stringify(payload, null, 2);
    document.getElementById('previewResponse').textContent = JSON.stringify(response, null, 2);

    document.getElementById('previewModal').style.display = 'flex';
    switchPreviewTab('payload', document.querySelector('#previewModal .tab-btn'));
}

function switchPreviewTab(tab, btn) {
    document.querySelectorAll('#previewModal .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('previewPayload').style.display = tab === 'payload' ? 'block' : 'none';
    document.getElementById('previewResponse').style.display = tab === 'response' ? 'block' : 'none';
}

function closePreview(e) {
    if (e.target === document.getElementById('previewModal')) {
        document.getElementById('previewModal').style.display = 'none';
    }
}

loadDocs();
</script>
{% endblock %}
